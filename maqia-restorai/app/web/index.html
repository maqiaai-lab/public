<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Maqia RestorAI</title>
<style>
  :root { --bg:#0f1115; --card:#1a1d24; --fg:#e8eaed; --muted:#9aa0aa; --accent:#c9a24b; --accent2:#e0c074; }
  * { box-sizing: border-box; }
  body { margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
         background:var(--bg); color:var(--fg); -webkit-font-smoothing:antialiased; }
  .wrap { max-width:640px; margin:0 auto; padding:24px 18px 60px; }
  header { text-align:center; padding:24px 0 8px; }
  header h1 { margin:0; font-size:26px; letter-spacing:.5px; }
  header h1 span { color:var(--accent); }
  header p { color:var(--muted); margin:8px 0 0; font-size:15px; }
  .card { background:var(--card); border-radius:16px; padding:22px; margin-top:22px;
          border:1px solid #262a33; }
  .btns { display:flex; flex-direction:column; gap:12px; }
  .btn { display:flex; align-items:center; justify-content:center; gap:10px;
         padding:16px; border-radius:12px; border:none; font-size:16px; font-weight:600;
         cursor:pointer; transition:transform .05s ease, background .2s; }
  .btn:active { transform:scale(.98); }
  .btn-primary { background:linear-gradient(135deg,var(--accent),var(--accent2)); color:#1a1206; }
  .btn-ghost { background:transparent; color:var(--fg); border:1px solid #333844; }
  input[type=file] { display:none; }
  .hint { color:var(--muted); font-size:13px; text-align:center; margin-top:14px; line-height:1.5; }
  .preview { margin-top:22px; text-align:center; }
  .preview img { max-width:100%; border-radius:12px; border:1px solid #262a33; }
  .status { margin-top:20px; text-align:center; color:var(--muted); font-size:15px; min-height:22px; }
  .spinner { display:inline-block; width:18px; height:18px; border:2px solid #3a3f4b;
             border-top-color:var(--accent); border-radius:50%; animation:spin 1s linear infinite;
             vertical-align:middle; margin-right:8px; }
  @keyframes spin { to { transform:rotate(360deg); } }
  .compare { margin-top:22px; }
  .compare .row { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .compare .row figure { margin:0; }
  .compare .row img { width:100%; border-radius:10px; border:1px solid #262a33; }
  .compare .row figcaption { text-align:center; color:var(--muted); font-size:13px; margin-top:6px; }
  .badge { display:inline-block; background:#23282f; color:var(--accent2); padding:4px 10px;
           border-radius:20px; font-size:12px; margin-top:12px; }
  .download { margin-top:16px; }
  .hidden { display:none; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Maqia <span>RestorAI</span></h1>
    <p>Bring an old photo back to life</p>
  </header>

  <div class="card" id="upload-card">
    <div class="btns">
      <button class="btn btn-primary" onclick="document.getElementById('camera').click()">
        📷 Take a photo of your print
      </button>
      <button class="btn btn-ghost" onclick="document.getElementById('gallery').click()">
        🖼️ Choose an existing file
      </button>
    </div>
    <input type="file" id="camera" accept="image/*" capture="environment">
    <input type="file" id="gallery" accept="image/*">
    <p class="hint">
      Don't have a scan? Just lay the photo flat in good light and snap it — we'll
      auto-detect the edges, straighten it, and crop it before restoring.
    </p>
  </div>

  <div class="preview hidden" id="preview">
    <img id="preview-img" alt="your photo">
  </div>

  <div class="status" id="status"></div>

  <div class="compare hidden" id="compare">
    <div class="row">
      <figure><img id="before-img" alt="before"><figcaption>Original</figcaption></figure>
      <figure><img id="after-img" alt="after"><figcaption>Restored</figcaption></figure>
    </div>
    <div style="text-align:center"><span class="badge hidden" id="dig-badge">✨ Auto-digitized from photo</span></div>
    <div class="download" style="text-align:center">
      <a class="btn btn-primary" id="download-link" download="restored.png" href="#">⬇️ Download restored photo</a>
    </div>
    <div style="text-align:center;margin-top:14px">
      <button class="btn btn-ghost" onclick="reset()">Restore another</button>
    </div>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);

function reset() {
  $('compare').classList.add('hidden');
  $('preview').classList.add('hidden');
  $('upload-card').classList.remove('hidden');
  $('status').textContent = '';
  $('camera').value = ''; $('gallery').value = '';
}

async function handleFile(file) {
  if (!file) return;
  $('upload-card').classList.add('hidden');
  $('preview').classList.remove('hidden');
  $('preview-img').src = URL.createObjectURL(file);
  $('status').innerHTML = '<span class="spinner"></span> Uploading…';

  const form = new FormData();
  form.append('file', file);

  let res;
  try {
    res = await fetch('/restore?digitize=auto', { method:'POST', body:form });
  } catch (e) { $('status').textContent = 'Upload failed. Try again.'; return; }
  if (!res.ok) { $('status').textContent = 'Server error: ' + res.status; return; }

  const { job_id } = await res.json();
  poll(job_id);
}

async function poll(jobId) {
  const steps = ['Analyzing damage…','Repairing scratches…','Restoring faces…','Adding color…','Sharpening…'];
  let i = 0;
  const tick = setInterval(() => {
    $('status').innerHTML = '<span class="spinner"></span> ' + steps[i % steps.length];
    i++;
  }, 3500);

  while (true) {
    await new Promise(r => setTimeout(r, 2500));
    let res;
    try { res = await fetch('/restore/' + jobId); } catch { continue; }
    const data = await res.json();

    if (data.status === 'done' || data.status === 'needs_review') {
      clearInterval(tick);
      showResult(data);
      return;
    }
    if (data.status === 'failed') {
      clearInterval(tick);
      $('status').textContent = 'Restoration failed. Please try another photo.';
      return;
    }
  }
}

function showResult(data) {
  $('status').textContent = '';
  $('preview').classList.add('hidden');
  $('before-img').src = data.original_url;
  $('after-img').src = data.result_url;
  $('download-link').href = data.result_url;
  if (data.was_digitized) $('dig-badge').classList.remove('hidden');
  else $('dig-badge').classList.add('hidden');
  $('compare').classList.remove('hidden');
}

$('camera').addEventListener('change', e => handleFile(e.target.files[0]));
$('gallery').addEventListener('change', e => handleFile(e.target.files[0]));
</script>
</body>
</html>
